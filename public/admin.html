<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7FAF9" />
  <title>管理后台 · 老人健康记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="page-shell admin-shell">
    <header class="page-header admin-header">
      <div class="header-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M3 9h18M9 21V9"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>管理后台</h1>
        <p>查看完整记录，下载 Excel 表格（CSV）</p>
      </div>
      <a href="index.html" class="btn-link-home">返回首页</a>
    </header>

    <section id="login-panel" class="card admin-login-card">
      <h2>管理员登录</h2>
      <p class="admin-login-hint">请输入管理员密码。初始密码为 <code>123456</code>，登录后可在后台修改。</p>
      <form id="login-form">
        <div class="field-row">
          <label for="admin-key">管理员密码</label>
          <input type="password" id="admin-key" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-submit">进入后台</button>
        <div id="login-message" class="message hidden" aria-live="polite"></div>
      </form>
    </section>

    <section id="admin-panel" class="hidden">
      <section class="card admin-type-tabs">
        <div class="type-tabs" role="tablist" aria-label="数据类型">
          <button type="button" class="type-tab active" data-type="cardio" role="tab" aria-selected="true">心血管数据</button>
          <button type="button" class="type-tab" data-type="glucose" role="tab" aria-selected="false">血糖数据</button>
        </div>
      </section>

      <section class="card admin-toolbar">
        <div class="admin-toolbar-row">
          <h2>数据表格</h2>
          <div class="range-buttons" role="group" aria-label="时间范围">
            <button type="button" data-range="7" class="range-btn">近7天</button>
            <button type="button" data-range="30" class="range-btn">近30天</button>
            <button type="button" data-range="90" class="range-btn active">近90天</button>
            <button type="button" data-range="all" class="range-btn">全部</button>
          </div>
        </div>
        <div class="admin-toolbar-row">
          <p id="record-count" class="record-count">共 0 条记录</p>
          <button type="button" id="download-btn" class="btn-submit btn-download">下载表格（CSV）</button>
        </div>
      </section>

      <section class="card admin-settings-card">
        <h2>修改管理员密码</h2>
        <p class="admin-settings-hint">修改密码需验证旧密码，并两次输入新密码确认。</p>
        <form id="password-form">
          <div class="field-row">
            <label for="old-password">旧密码</label>
            <input type="password" id="old-password" autocomplete="current-password" required />
          </div>
          <div class="field-row">
            <label for="new-password">新密码</label>
            <input type="password" id="new-password" autocomplete="new-password" minlength="6" required />
          </div>
          <div class="field-row">
            <label for="confirm-password">确认新密码</label>
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="6" required />
          </div>
          <button type="submit" class="btn-submit btn-settings">保存新密码</button>
          <div id="password-message" class="message hidden" aria-live="polite"></div>
        </form>
      </section>

      <section class="card admin-table-card">
        <div class="table-scroll">
          <table class="data-table" id="data-table">
            <thead id="table-head">
              <tr>
                <th>日期</th>
                <th>时段</th>
                <th>心率</th>
                <th>高压</th>
                <th>低压</th>
                <th>血氧</th>
                <th>录入时间</th>
              </tr>
            </thead>
            <tbody id="table-body">
              <tr><td colspan="7" class="table-empty">加载中…</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
