<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7FAF9" />
  <title>老人健康记录</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-shell home-shell">
    <header class="page-header home-header">
      <div class="header-text header-text-center">
        <h1>老人健康记录</h1>
        <p>请选择今天要记录的项目</p>
      </div>
    </header>

    <main class="branch-grid">
      <a id="link-cardio" href="cardio.html" class="branch-card branch-card-cardio">
        <div class="branch-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </div>
        <h2>心血管数据</h2>
        <p>记录心率、血压、血氧，早晚各一次</p>
      </a>

      <a id="link-glucose" href="glucose.html" class="branch-card branch-card-glucose">
        <div class="branch-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
          </svg>
        </div>
        <h2>血糖数据</h2>
        <p>记录空腹与三餐后血糖</p>
      </a>
    </main>

    <p class="home-admin-link">
      <a id="link-admin" href="admin.html">管理员入口</a>
    </p>
  </div>

  <script>
    (function () {
      const key = new URLSearchParams(window.location.search).get('key');
      if (!key) return;
      ['link-cardio', 'link-glucose', 'link-admin'].forEach((id) => {
        const el = document.getElementById(id);
        const url = new URL(el.getAttribute('href'), window.location.origin);
        url.searchParams.set('key', key);
        el.setAttribute('href', `${url.pathname}${url.search}`);
      });
    })();
  </script>
</body>
</html>
